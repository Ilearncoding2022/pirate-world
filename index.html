<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Pirate World</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Renderer canvas host. main.ts mounts the WebGL canvas here. -->
    <div id="app"></div>

    <!-- HUD overlay. pointer-events:none at this level; only controls opt back in. -->
    <div class="hud">
      <!-- ===================== TELEMETRY ===================== -->
      <section class="panel panel--telemetry" aria-label="Telemetry">
        <header class="panel__title">
          <span class="panel__dot"></span>
          <span>TELEMETRY</span>
        </header>

        <!-- Ground speed, with the wind's signed share of it trailing. The
             two are wrapped together so the pair rides the row's right edge
             as one value; the suffix ships empty and CSS collapses it, which
             is how a windless run keeps the SPD row exactly as it always
             looked. -->
        <div class="readout">
          <span class="readout__key">SPD</span>
          <span class="spd spd--calm" id="hud-spd">
            <span class="readout__val" id="hud-speed">0 kn</span>
            <!-- The gust glyph labels the grey figure beside it as the wind's
                 doing rather than the engine's. It ships hidden, with the
                 wrapper calm, because the sim starts in a calm and hud.ts
                 reads that class back rather than assuming it. -->
            <span class="spd__gust" aria-hidden="true">
              <svg viewBox="0 0 24 16" xmlns="http://www.w3.org/2000/svg" focusable="false">
                <path class="spd__gust-stroke" d="M2 4h11a2.6 2.6 0 1 0-2.6-2.6" />
                <path class="spd__gust-stroke" d="M2 8h15a2.9 2.9 0 1 1-2.9 2.9" />
                <path class="spd__gust-stroke" d="M2 12h8" />
              </svg>
            </span>
            <span class="spd__wind" id="hud-speed-wind"></span>
          </span>
        </div>

        <!-- True wind. The arrow is bow-relative, matching the bow-up scope
             rather than the north-up compass, so it points where the wind is
             pushing the hull. It ships calm because the sim does; hud.ts
             reads that class back rather than assuming it. -->
        <div class="readout">
          <span class="readout__key">WND</span>
          <span class="wnd wnd--calm" id="hud-wnd">
            <span class="wnd__arrow" id="hud-wnd-arrow" aria-hidden="true">
              <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" focusable="false">
                <polygon class="wnd__dart" points="50,8 80,92 50,70 20,92" />
              </svg>
            </span>
            <span class="readout__val wnd__val" id="hud-wnd-value">CALM</span>
          </span>
        </div>

        <!-- The purse. It sits between the weather and the power because it
             is the one warm figure on a cold panel and the rule beneath the
             PWR block would otherwise separate it from the readouts it is
             one of. hud.ts writes it from a wallet subscription, not from the
             frame loop, so the shipped 0 is what a new save actually holds
             and the first write is a real catch. -->
        <div class="readout">
          <span class="readout__key">GOLD</span>
          <span class="readout__val gold__val" id="hud-gold">0</span>
        </div>

        <!-- Reserve power. hud.ts swaps one pwr--* modifier on this wrapper
             and every colour below it follows, so the number, the bar and the
             tag can never end up in different states. Segments ship lit and
             the tag ships SOLAR to match the full tank the sim starts with;
             hud.ts reads both back at construction rather than assuming. -->
        <div class="pwr pwr--solar" id="hud-pwr">
          <div class="readout">
            <span class="readout__key">PWR</span>
            <span class="readout__val pwr__val" id="hud-pwr-value">100%</span>
          </div>

          <!-- Ten notches, lit from the left; hud.ts touches only the ones
               that actually change hands. -->
          <div
            class="pwr__bar"
            id="hud-pwr-bar"
            role="meter"
            aria-label="Reserve power"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="100"
          >
            <span class="pwr__seg is-lit"></span>
            <span class="pwr__seg is-lit"></span>
            <span class="pwr__seg is-lit"></span>
            <span class="pwr__seg is-lit"></span>
            <span class="pwr__seg is-lit"></span>
            <span class="pwr__seg is-lit"></span>
            <span class="pwr__seg is-lit"></span>
            <span class="pwr__seg is-lit"></span>
            <span class="pwr__seg is-lit"></span>
            <span class="pwr__seg is-lit"></span>
          </div>

          <div class="pwr__status">
            <span class="pwr__tag" id="hud-pwr-mode">SOLAR</span>
            <span class="pwr__rate" id="hud-pwr-rate">+0.00 %/s</span>
          </div>
        </div>

        <div class="panel__rule"></div>
        <p class="panel__note">PIRATE WORLD &#8226; NAV CORE v0.1</p>
      </section>

      <!-- ===================== HUD DOCK =====================
           Owned by agent D. Everything between this comment and the
           matching END marker belongs to one agent; edit inside it, never
           replace the file. The gold readout goes in the telemetry panel
           above, between the WND and PWR rows. -->
      <!-- HUD DOCK -->
      <!-- The two things the ship can do that are not steering it. Styled as
           the helm keys are, and for the same reason: everything on this HUD
           that can be pressed looks like a key, so anything that looks like a
           key can be pressed.

           [FISH] ships ARMED, with no title, because the sim starts on a full
           tank. hud.ts reads that state back off the markup rather than
           assuming it, so the first frame writes no attribute at all -- the
           same contract the PWR block's shipped-lit segments keep. -->
      <nav class="dock" aria-label="Ship activities">
        <button id="btn-fish" class="dbtn dock__btn" type="button" aria-label="Go fishing">
          <span class="dock__key">FISH</span>
        </button>
        <button id="btn-fishbook" class="dbtn dock__btn" type="button" aria-label="Open the fish book">
          <span class="dock__key">FISH BOOK</span>
        </button>
      </nav>
      <!-- END HUD DOCK -->

      <!-- ===================== RADAR ===================== -->
      <section class="panel panel--radar" aria-label="Surface radar">
        <header class="panel__title">
          <span class="panel__dot"></span>
          <span>RADAR</span>
        </header>

        <!-- radar.ts repaints this every frame. Bow-up: own ship is always at
             dead centre pointing at 12 o'clock, and the magenta pip on the rim
             is north. -->
        <!-- Heading between the two halves of the fix, all three above the
             scope. They were tried inside the glass and taken back out: the
             disc is where the plot is, and at 118px the two coordinate blocks
             met in the middle of it. Out here they get the panel's full width
             and the plot gets its own back. -->
        <div class="radar__head">
          <div class="radar__fix">
            <span class="radar__fix-key">LAT</span>
            <span class="radar__fix-val" id="hud-lat">00.0&deg; N</span>
          </div>
          <div class="radar__hdg">
            <span class="hdg__value" id="hud-heading">000&deg;</span>
            <span class="hdg__label">HDG</span>
          </div>
          <div class="radar__fix">
            <span class="radar__fix-key">LON</span>
            <span class="radar__fix-val" id="hud-lon">000.0&deg; E</span>
          </div>
        </div>

        <div class="radar">
          <canvas class="radar__scope" id="hud-radar" aria-hidden="true"></canvas>
        </div>

        <!-- timedial.ts repaints this every frame. One lap is one LOCAL solar
             day, which is not a fixed length of real time: the ship outruns
             the terminator, so running east drives the marker round and
             running west can stall it. Noon is at the top, the lit arc is
             daylight. -->
        <div class="timedial">
          <canvas class="timedial__face" id="hud-timedial" aria-hidden="true"></canvas>
        </div>
      </section>

      <!-- ===================== D-PAD ===================== -->
      <nav class="dpad" aria-label="Helm controls">
        <button id="btn-up" class="dbtn dbtn--up" type="button" aria-label="Thrust">
          <span class="dbtn__glyph">&#9650;</span>
          <span class="dbtn__label">Thrust</span>
        </button>
        <button id="btn-left" class="dbtn dbtn--left" type="button" aria-label="Turn to port">
          <span class="dbtn__glyph">&#9664;</span>
          <span class="dbtn__label">Port</span>
        </button>
        <!-- The hole in the middle of the pad is the compass bezel. -->
        <div class="dpad__hub">
          <div class="compass" aria-hidden="true">
            <!-- Fixed rose: rings, graduations, cardinal letters -->
            <svg
              class="compass__rose"
              viewBox="0 0 100 100"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
              focusable="false"
            >
              <defs>
                <radialGradient id="roseGlass" cx="50%" cy="34%" r="76%">
                  <stop offset="0%" stop-color="#0e2536" stop-opacity="0.95" />
                  <stop offset="62%" stop-color="#050b14" stop-opacity="0.95" />
                  <stop offset="100%" stop-color="#02040a" stop-opacity="0.98" />
                </radialGradient>
              </defs>

              <circle cx="50" cy="50" r="48.5" fill="url(#roseGlass)" />
              <circle class="rose__ring rose__ring--outer" cx="50" cy="50" r="48" />
              <circle class="rose__ring" cx="50" cy="50" r="41" />
              <circle class="rose__ring rose__ring--faint" cx="50" cy="50" r="30" />

              <!-- graduations every 15 degrees -->
              <g class="rose__ticks">
                <line class="tick tick--major" x1="50" y1="42" x2="50" y2="49.5" transform="rotate(0 50 50)" />
                <line class="tick" x1="50" y1="44.5" x2="50" y2="49.5" transform="rotate(15 50 50)" />
                <line class="tick" x1="50" y1="44.5" x2="50" y2="49.5" transform="rotate(30 50 50)" />
                <line class="tick tick--mid" x1="50" y1="43.5" x2="50" y2="49.5" transform="rotate(45 50 50)" />
                <line class="tick" x1="50" y1="44.5" x2="50" y2="49.5" transform="rotate(60 50 50)" />
                <line class="tick" x1="50" y1="44.5" x2="50" y2="49.5" transform="rotate(75 50 50)" />
                <line class="tick tick--major" x1="50" y1="42" x2="50" y2="49.5" transform="rotate(90 50 50)" />
                <line class="tick" x1="50" y1="44.5" x2="50" y2="49.5" transform="rotate(105 50 50)" />
                <line class="tick" x1="50" y1="44.5" x2="50" y2="49.5" transform="rotate(120 50 50)" />
                <line class="tick tick--mid" x1="50" y1="43.5" x2="50" y2="49.5" transform="rotate(135 50 50)" />
                <line class="tick" x1="50" y1="44.5" x2="50" y2="49.5" transform="rotate(150 50 50)" />
                <line class="tick" x1="50" y1="44.5" x2="50" y2="49.5" transform="rotate(165 50 50)" />
                <line class="tick tick--major" x1="50" y1="42" x2="50" y2="49.5" transform="rotate(180 50 50)" />
                <line class="tick" x1="50" y1="44.5" x2="50" y2="49.5" transform="rotate(195 50 50)" />
                <line class="tick" x1="50" y1="44.5" x2="50" y2="49.5" transform="rotate(210 50 50)" />
                <line class="tick tick--mid" x1="50" y1="43.5" x2="50" y2="49.5" transform="rotate(225 50 50)" />
                <line class="tick" x1="50" y1="44.5" x2="50" y2="49.5" transform="rotate(240 50 50)" />
                <line class="tick" x1="50" y1="44.5" x2="50" y2="49.5" transform="rotate(255 50 50)" />
                <line class="tick tick--major" x1="50" y1="42" x2="50" y2="49.5" transform="rotate(270 50 50)" />
                <line class="tick" x1="50" y1="44.5" x2="50" y2="49.5" transform="rotate(285 50 50)" />
                <line class="tick" x1="50" y1="44.5" x2="50" y2="49.5" transform="rotate(300 50 50)" />
                <line class="tick tick--mid" x1="50" y1="43.5" x2="50" y2="49.5" transform="rotate(315 50 50)" />
                <line class="tick" x1="50" y1="44.5" x2="50" y2="49.5" transform="rotate(330 50 50)" />
                <line class="tick" x1="50" y1="44.5" x2="50" y2="49.5" transform="rotate(345 50 50)" />
              </g>

              <!-- cardinal labels -->
              <g class="rose__labels" text-anchor="middle" dominant-baseline="central">
                <text class="rose__label rose__label--n" x="50" y="36.5">N</text>
                <text class="rose__label" x="63.5" y="50">E</text>
                <text class="rose__label" x="50" y="63.5">S</text>
                <text class="rose__label" x="36.5" y="50">W</text>
              </g>
            </svg>

            <!-- Rotating needle. hud.ts sets style.transform = rotate(<heading>deg) -->
            <div class="compass__needle" id="hud-compass-needle">
              <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
                <polygon class="needle__north" points="50,13 55.5,50 50,56 44.5,50" />
                <polygon class="needle__south" points="50,87 44.5,50 50,44 55.5,50" />
                <circle class="needle__hub" cx="50" cy="50" r="4.2" />
                <circle class="needle__hub-core" cx="50" cy="50" r="1.5" />
              </svg>
            </div>

            <!-- Fixed lubber line on the bezel -->
            <div class="compass__lubber"></div>
          </div>
        </div>
        <button id="btn-right" class="dbtn dbtn--right" type="button" aria-label="Turn to starboard">
          <span class="dbtn__glyph">&#9654;</span>
          <span class="dbtn__label">Starboard</span>
        </button>
        <button id="btn-down" class="dbtn dbtn--down" type="button" aria-label="Reverse">
          <span class="dbtn__glyph">&#9660;</span>
          <span class="dbtn__label">Reverse</span>
        </button>
      </nav>

      <!-- ===================== LEGEND ===================== -->
      <details class="legend" open>
        <summary class="legend__summary">
          <span class="legend__chev">&#9656;</span>
          <span>CONTROLS</span>
        </summary>
        <ul class="legend__list">
          <li><kbd>W</kbd><kbd>S</kbd><span>Thrust / Reverse</span></li>
          <li><kbd>A</kbd><kbd>D</kbd><span>Port / Starboard</span></li>
          <li><kbd>&#8593;</kbd><kbd>&#8595;</kbd><kbd>&#8592;</kbd><kbd>&#8594;</kbd><span>Same as WASD</span></li>
          <li><kbd>Scroll</kbd><span>Zoom camera</span></li>
        </ul>
      </details>
    </div>

    <!-- ===================== FISHING CARD =====================
         Owned by agent B. The overlay lives OUTSIDE .hud, because .hud is
         pointer-events:none and the card needs the pointer; it also has to
         paint over the whole viewport rather than sit inside the HUD's
         padding. Ships hidden. -->
    <!-- FISHING CARD -->
    <div class="fishing" id="fishing" hidden>
      <!-- 9:16, sized off the viewport height, so the card is the same picture
           on a phone and on a desktop. `fishrender.ts` draws it in card units
           and never learns how big it ended up. -->
      <div class="fishing__card" role="dialog" aria-modal="true" aria-label="Fishing">
        <!-- The canvas fills the WHOLE card. The chrome floats over it rather
             than taking a row of its own: give the readouts a row and the
             canvas stops being 9:16, and every y in the geometry table —
             waterline 0.28, rows at 0.55 to 1.47 — starts meaning something
             else. There is nothing under it but empty sky. -->
        <canvas class="fishing__canvas" id="fishing-canvas"></canvas>

        <header class="fishing__chrome">
          <span class="fishing__clock" id="fishing-clock">0:30</span>
          <span class="fishing__shots" id="fishing-shots">10 shots</span>
          <span class="fishing__gold" id="fishing-gold">0</span>
        </header>

        <!-- Shown by fishing.ts when the clock or the shots run out, and on
             Escape. Never a second overlay: the card stays, so FISH AGAIN can
             start a new session without a fade. -->
        <section class="fishing__summary" id="fishing-summary" hidden>
          <h2 class="fishing__summary-title">Catch log</h2>
          <ul class="fishing__catches" id="fishing-catches"></ul>
          <p class="fishing__total" id="fishing-total">+0 gold</p>
          <div class="fishing__actions">
            <button class="fbtn fbtn--go" id="fishing-again" type="button">
              Fish again <span class="fbtn__cost">-50% pwr</span>
            </button>
            <button class="fbtn" id="fishing-close" type="button">Close</button>
          </div>
        </section>
      </div>
    </div>
    <!-- END FISHING CARD -->

    <!-- ===================== FISH BOOK =====================
         Owned by agent C. Same reasons, same rules. Ships hidden. -->
    <!-- FISH BOOK -->
    <!-- The body ships EMPTY. fishbook.ts builds every tier group and every
         species row from `species.ts`, so the catalogue exists in exactly one
         place and a new fish needs no edit here. It also means an uncaught
         species' name is never in the document at all, which is the point:
         UNKNOWN is a spoiler one inspector click away otherwise. -->
    <div class="fishbook" id="fishbook" hidden aria-hidden="true">
      <div class="fishbook__backdrop" id="fishbook-backdrop"></div>

      <section
        class="fishbook__panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="fishbook-title"
      >
        <header class="fishbook__head">
          <span class="panel__dot"></span>
          <h2 class="fishbook__title" id="fishbook-title">FISH BOOK</h2>
          <button class="fishbook__close" id="fishbook-close" type="button" aria-label="Close">
            &#10005;
          </button>
        </header>

        <div class="fishbook__body" id="fishbook-body"></div>

        <footer class="fishbook__foot" id="fishbook-foot"></footer>
      </section>
    </div>

    <!-- END FISH BOOK -->

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
